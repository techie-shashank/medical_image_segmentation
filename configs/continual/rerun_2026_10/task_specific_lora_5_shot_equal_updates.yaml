# k = 5 with the update count of the full-data runs (216 epochs x 5 = 1,080 updates per task).
# Copied from exp_20260926_120018_3ab58c90 (task-specific LoRA r = 4, k = 5); only epochs and validation_interval changed. Generated 2026-10-22.
continual:
  from_scratch: false
  lora:
    alpha: 16
    attn_parts:
    - q
    - v
    bias: none
    dropout: 0.05
    rank: 4
    target_modules:
    - multihead_attn
  output_dir: /home/vault/iwi5/iwi5326h/projects/VoxTell/experiments/continual/lora/task_specific
  retention_tasks:
  - dataset:
      name: aeropath
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/AeroPath/
    name: aeropath
  strategy: lora
  tasks:
  - dataset:
      name: skm_tea_lateral_tibial
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_lateral_tibial
  - dataset:
      name: skm_tea_medial_tibial
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_medial_tibial
  - dataset:
      name: skm_tea_femoral
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_femoral
  - dataset:
      name: skm_tea_patellar
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_patellar
  - dataset:
      name: skm_tea_medial_meniscus
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_medial_meniscus
  - dataset:
      name: skm_tea_lateral_meniscus
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_lateral_meniscus
dataset:
  batch_size: 1
  patch_size:
  - 192
  - 192
  - 192
  seed: 42
  train_fraction: 0.7
  train_max_cases: 5
  val_fraction: 0.15
model:
  deep_supervision: false
  device: cuda
  dir: ./models/voxtell_v1.1
  reinit_weights: false
training:
  epochs: 216
  optimizer:
    lr: 0.0001
    momentum: 0.99
    nesterov: true
    poly_power: 1.0
    weight_decay: 3.0e-05
  seed: 42
  use_deterministic_algorithms: true
  validation_interval: 24
