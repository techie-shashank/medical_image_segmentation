# Joint fine-tuning on all six tasks (upper reference), first 20 training volumes per task
# Generated 2026-10-22 for the reruns (see thesis_notes.md); settings copied from the original run.
continual:
  from_scratch: false
  output_dir: /home/vault/iwi5/iwi5326h/projects/VoxTell/experiments/continual/joint_fine_tuning
  retention_tasks:
  - dataset:
      name: aeropath
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/AeroPath/
    name: aeropath
  tasks:
  - name: skm_tea_joint
    dataset:
      name: skm_tea_joint
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
      joint_names:
      - skm_tea_lateral_tibial
      - skm_tea_medial_tibial
      - skm_tea_femoral
      - skm_tea_patellar
      - skm_tea_medial_meniscus
      - skm_tea_lateral_meniscus
  evaluation:
    checkpoint: last_model.pt
    extra:
    - tag: best_validation
      checkpoint: best_model.pt
    tasks:
    - dataset:
        name: skm_tea_lateral_tibial
        root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
      name: skm_tea_lateral_tibial
    - dataset:
        name: skm_tea_medial_tibial
        root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
      name: skm_tea_medial_tibial
    - dataset:
        name: skm_tea_femoral
        root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
      name: skm_tea_femoral
    - dataset:
        name: skm_tea_patellar
        root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
      name: skm_tea_patellar
    - dataset:
        name: skm_tea_medial_meniscus
        root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
      name: skm_tea_medial_meniscus
    - dataset:
        name: skm_tea_lateral_meniscus
        root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
      name: skm_tea_lateral_meniscus
dataset:
  batch_size: 1
  patch_size:
  - 192
  - 192
  - 192
  seed: 42
  train_fraction: 0.7
  val_fraction: 0.15
  train_max_cases: 20
model:
  deep_supervision: false
  device: cuda
  dir: ./models/voxtell_v1.1
  reinit_weights: false
training:
  epochs: 10
  optimizer:
    lr: 0.0001
    momentum: 0.99
    nesterov: true
    poly_power: 1.0
    weight_decay: 3.0e-05
  seed: 42
  use_deterministic_algorithms: true
