# SMOKE TEST ONLY (2 tasks, 3 epochs, validation after epochs 2 and 3, 1 volume per split). Do not use for results.
continual:
  from_scratch: false
  output_dir: /home/vault/iwi5/iwi5326h/projects/VoxTell/experiments/continual/smoke_test/ft_5_shot_equal_updates
  retention_tasks:
  - dataset:
      name: aeropath
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/AeroPath/
    name: aeropath
  tasks:
  - dataset:
      name: skm_tea_lateral_tibial
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_lateral_tibial
  - dataset:
      name: skm_tea_medial_tibial
      root: /home/vault/iwi5/iwi5326h/projects/VoxTell/data/skm_tea/
    name: skm_tea_medial_tibial
  evaluation:
    checkpoint: last_model.pt
    extra:
    - tag: best_validation
      checkpoint: best_model.pt
dataset:
  batch_size: 1
  patch_size:
  - 192
  - 192
  - 192
  seed: 42
  train_fraction: 0.7
  train_max_cases: 1
  val_fraction: 0.15
  val_max_cases: 1
  test_max_cases: 1
model:
  deep_supervision: false
  device: cuda
  dir: ./models/voxtell_v1.1
  reinit_weights: false
training:
  epochs: 3
  optimizer:
    lr: 0.0001
    momentum: 0.99
    nesterov: true
    poly_power: 1.0
    weight_decay: 3.0e-05
  seed: 42
  use_deterministic_algorithms: true
  validation_interval: 2
